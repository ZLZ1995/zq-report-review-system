# S8-01 全仓 Ruff 基线配置
# 策略：不 pin select，保持 ruff 工具链默认规则集；
# 133 处存量违规按文件冻结在 per-file-ignores 中，新增文件必须零告警。
[tool.ruff]
target-version = "py310"

# S8-02 mypy 类型检查：优先覆盖 agent_core / server billing / provider gateway /
# review job / browser runtime / updates。宽松基线，禁止隐式 Any 扩散以外的存量逐一清理。
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
strict_optional = true
show_error_codes = true

