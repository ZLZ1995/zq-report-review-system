name: technical-platform-client

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  client-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client test dependencies
        shell: cmd
        run: >-
          python -m pip install -r deploy\report_review_server\requirements.txt
          pytest cryptography httpx pyyaml PySide6 pywin32 python-docx openpyxl pdfplumber
          xlrd xlwt ruff pyinstaller
      - name: Run client static and security checks
        shell: cmd
        run: >-
          python -m ruff check src tests scripts deploy
      - name: Run update and client contract suites
        shell: cmd
        run: >-
          python -m pytest tests\platform_update tests\technical_platform tests\report_review_app
          -q --basetemp=D:\zq-client-pytest

  client-build:
    runs-on: windows-latest
    needs: client-regression
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: cmd
        run: >-
          python -m pip install -r deploy\report_review_server\requirements.txt
          PySide6 pywin32 python-docx openpyxl pdfplumber pyyaml xlrd pyinstaller packaging
      - name: Build and package immutable Windows candidate
        shell: cmd
        run: >-
          python scripts\build_technical_platform.py &&
          python scripts\package_technical_platform.py
      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: zq-workspace-windows-${{ github.sha }}
          path: |
            dist/technical_platform/ZQ-Workspace-*-Windows.zip
            dist/technical_platform/ZQ-Workspace-*-Windows.json
          if-no-files-found: error
          retention-days: 7
