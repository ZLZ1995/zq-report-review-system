name: report-review-server

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/report_review_server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install -r deploy/report_review_server/requirements.txt pytest
      - name: Run server contract and regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/report_review_server -q

  server-image:
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build server image with immutable source stamp
        run: >-
          docker build
          --build-arg REPORT_REVIEW_BUILD_SHA=${{ github.sha }}
          --file deploy/report_review_server/Dockerfile
          --tag zq-report-review-server:${{ github.sha }}
          .
