name: report-review-server

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/report_review_server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install -r deploy/report_review_server/requirements.txt pytest pyyaml ruff mypy
      - name: Run server static checks
        run: >-
          python -m ruff check src tests scripts deploy
      - name: Run type checks on priority modules
        run: >-
          python -m mypy
          src/asset_based_agent/technical_platform/agent_core
          src/asset_based_agent/report_review_server/services/metered_model_service.py
          src/asset_based_agent/report_review_server/services/wallet_service.py
          src/asset_based_agent/report_review_server/services/billing_reconciliation.py
          src/asset_based_agent/report_review_server/services/provider_gateway.py
          src/asset_based_agent/report_review_server/services/review_job_service.py
          src/asset_based_agent/report_review_server/services/review_job_executor.py
          src/asset_based_agent/technical_platform/browser_task_host.py
          src/asset_based_agent/technical_platform/browser_task_leases.py
          src/asset_based_agent/technical_platform/browser_task_permissions.py
          src/asset_based_agent/technical_platform/browser_task_spec.py
          src/asset_based_agent/technical_platform/browser_execution_loop.py
          src/asset_based_agent/technical_platform/browser_runtime_factory.py
          src/asset_based_agent/technical_platform/updates
      - name: Run server contract and regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/report_review_server -q

  server-image:
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build server image with immutable source stamp
        run: >-
          docker build
          --build-arg REPORT_REVIEW_BUILD_SHA=${{ github.sha }}
          --file deploy/report_review_server/Dockerfile
          --tag zq-report-review-server:${{ github.sha }}
          .
